<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 1 26 16" width="117" height="72">
  <!-- ProxyGo's menu bar icon: the app icon's packet, with its speed lines,
       going forward through one chevron, drawn black for macOS to tint as
       a template image. The menu bar shows it 18 points tall, the
       chevron filling most of that, as its neighbors do.
       internal/app/menubar.png is this file at 4.5x:
       rsvg-convert -w 117 -h 72 assets/icon/menubar.svg -o internal/app/menubar.png -->
  <path d="M2.5 6.6H6.5M1.5 9H6.5M2.5 11.4H6.5" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12" cy="9" r="3.8" fill="#000"/>
  <path d="M18.5 3.5L24 9L18.5 14.5" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
